<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 224" width="860" height="224" role="img">
<defs>
<pattern id="pts" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#39d353"/></pattern>
<linearGradient id="fi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="fd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
<mask id="mi"><rect x="0" y="0" width="230" height="224" fill="url(#fi)"/></mask>
<mask id="md"><rect x="630" y="0" width="230" height="224" fill="url(#fd)"/></mask>
<linearGradient id="luz" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0"><stop offset="0" stop-color="#e6edf3"/><stop offset=".5" stop-color="#39d353"/><stop offset="1" stop-color="#e6edf3"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-320 0;920 0;920 0" keyTimes="0;0.55;1" dur="5s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="li" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39d353" stop-opacity="0"/><stop offset="1" stop-color="#39d353" stop-opacity=".8"/></linearGradient>
<linearGradient id="ld" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39d353" stop-opacity=".8"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></linearGradient>
</defs>
<style>@font-face{font-family:'SG';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.sg{font-family:'SG',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-weight:700}
@keyframes raya{0%{transform:scaleX(0)}45%,70%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
@keyframes chip{0%,100%{fill-opacity:.08;stroke-opacity:.7}18%{fill-opacity:.32;stroke-opacity:1}36%{fill-opacity:.08;stroke-opacity:.7}}
@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes linea{0%,100%{transform:scaleX(.35)}50%{transform:scaleX(1)}}
@keyframes deriva{from{transform:translateY(0)}to{transform:translateY(-18px)}}
@keyframes sube{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style>
<g mask="url(#mi)"><rect x="0" y="0" width="230" height="242" fill="url(#pts)" style="animation:deriva 3s linear infinite"/></g>
<g mask="url(#md)"><rect x="630" y="0" width="230" height="242" fill="url(#pts)" style="animation:deriva 3s linear infinite"/></g>
<rect x="240.0" y="29" width="120" height="1.5" fill="url(#li)" style="transform-origin:360.0px 30px;animation:linea 4s ease-in-out infinite"/>
<rect x="500.0" y="29" width="120" height="1.5" fill="url(#ld)" style="transform-origin:500.0px 30px;animation:linea 4s ease-in-out infinite"/>
<text x="430.0" y="34" fill="#7d8590" font-size="13" letter-spacing="5" text-anchor="middle">HI, I'M</text>
<text class="sg" x="286.8" y="112" font-size="92" letter-spacing="1" fill="url(#luz)">Oscar</text><text class="sg" x="545.8" y="112" font-size="92" fill="#39d353">.</text>

<text x="430.0" y="158" font-size="16.5" letter-spacing="1.5" text-anchor="middle"><tspan fill="#e6edf3">Software Engineering Student </tspan><tspan fill="#7d8590">@ </tspan><tspan fill="#39d353" font-weight="700">TECSUP</tspan></text>
<rect x="244.3" y="180" width="86.9" height="28" rx="14" fill="#39d353" fill-opacity=".08" stroke="#39d353" stroke-opacity=".7" style="animation:chip 4.5s ease-in-out 0.0s infinite"/><text x="287.8" y="198.5" fill="#e6edf3" font-size="13.5" text-anchor="middle">Backend</text><rect x="341.2" y="180" width="78.8" height="28" rx="14" fill="#39d353" fill-opacity=".08" stroke="#39d353" stroke-opacity=".7" style="animation:chip 4.5s ease-in-out 1.5s infinite"/><text x="380.6" y="198.5" fill="#e6edf3" font-size="13.5" text-anchor="middle">Mobile</text><rect x="430.0" y="180" width="54.4" height="28" rx="14" fill="#39d353" fill-opacity=".08" stroke="#39d353" stroke-opacity=".7" style="animation:chip 4.5s ease-in-out 3.0s infinite"/><text x="457.2" y="198.5" fill="#e6edf3" font-size="13.5" text-anchor="middle">IoT</text><rect x="502.4" y="184" width="1" height="20" fill="#263238"/><g style="animation:pin 2.4s ease-in-out infinite"><path transform="translate(520.4,185)" d="M7 0a7 7 0 0 1 7 7c0 5-7 12-7 12S0 12 0 7a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill="#39d353" fill-rule="evenodd"/></g><text x="542.4" y="198.5" fill="#7d8590" font-size="13.5">Lima, Peru</text>
</svg>