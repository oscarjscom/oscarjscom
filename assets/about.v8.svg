<text x="14" y="56" fill="#e6edf3" font-size="13.5" xml:space="preserve">I&#x27;m a Software Engineering student at TECSUP (5th term) in Lima,</text>
<text x="14" y="77" fill="#e6edf3" font-size="13.5" xml:space="preserve">Peru. I focus on backend and full stack development, and I like</text>
<text x="14" y="98" fill="#e6edf3" font-size="13.5" xml:space="preserve">taking a project end to end: from the API to the mobile app.</text>
