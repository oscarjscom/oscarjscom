<style>@font-face{font-family:'Orb';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.orb{font-family:'Orb',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-weight:900}
@keyframes cae{0%{opacity:1;fill:#eaffea}12%{opacity:.9;fill:#a3e635}45%{opacity:.4;fill:#39d353}80%,100%{opacity:.08;fill:#39d353}}
@keyframes lluvia{0%,22%{opacity:1}32%,93%{opacity:.28}100%{opacity:1}}
