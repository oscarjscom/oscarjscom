@keyframes jp{0%,0.50%{opacity:0;letter-spacing:14px}2.50%,10.00%{opacity:1;letter-spacing:3px}11.75%,100%{opacity:0;letter-spacing:3px}}
@keyframes tr{0%,11.75%{opacity:0;fill:#a3e635}12.75%{opacity:1;fill:#eaffea}14.50%,23.25%{opacity:1;fill:#e6edf3}24.50%,100%{opacity:0;fill:#e6edf3}}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
@keyframes avanza{from{width:0}to{width:300px}}
